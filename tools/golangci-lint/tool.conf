# golangci-lint 2.x, the Go linter runner, behind CodingBooth's go+linter extension
# (`install go github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`). Built from the
# /v2 Go module once per Ubuntu + CPU. 1.x is not built: its last release (1.64.8) cannot load
# packages compiled by current Go ("export data version 5 is greater than maximum supported
# version 2"), so it fails on every module.
ARCH_MODE=native
UPSTREAM="https://github.com/golangci/golangci-lint"
# Layout: bin/golangci-lint, built with cgo off (a static binary), plus LICENSE. At run time it
# drives the booth's own go toolchain.
