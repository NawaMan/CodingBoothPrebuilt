# Delve (dlv), the Go debugger, which CodingBooth's go template installs into every Go booth
# (`install go github.com/go-delve/delve/cmd/dlv@latest`). Upstream publishes no Linux
# binaries, so every booth compiled it; this builds it once per Ubuntu + CPU.
ARCH_MODE=native
UPSTREAM="https://github.com/go-delve/delve"
# Layout: bin/dlv, built with cgo off (a static binary), plus LICENSE.
