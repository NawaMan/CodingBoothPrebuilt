# hey, an HTTP load generator, the Go CLI CodingBooth's install-go test builds with
# `install go github.com/rakyll/hey@latest`. Upstream ships an amd64 binary only, from its own
# bucket; this builds it once per Ubuntu + CPU.
ARCH_MODE=native
UPSTREAM="https://github.com/rakyll/hey"
# Layout: bin/hey, built with cgo off (a static binary), plus LICENSE.
