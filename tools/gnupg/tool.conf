# GnuPG 2.5, which CodingBooth's base image puts in /usr/local over Ubuntu's 2.4 (end of life
# upstream). Upstream ships source only; building it takes a few minutes of every base image
# build, so this builds it once per Ubuntu + CPU.
ARCH_MODE=native
UPSTREAM="https://gnupg.org/"
# Layout: an installed /usr/local tree (bin/, sbin/, libexec/, share/), built with
# --prefix=/usr/local --sysconfdir=/etc --localstatedir=/var, so it runs only once copied
# into /usr/local. RUNTIME-DEPS.txt names the Ubuntu packages holding the shared libraries
# it links (one per line); COPYING is GnuPG's licence.
