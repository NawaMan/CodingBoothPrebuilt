# Elm, the compiler for the Elm language. Upstream's 0.19.1 ships a linux x86_64 binary
# only; 0.19.2 and later ship linux x64 and arm64, so this builds 0.19.1 alone, for both
# CPUs, so CodingBooth's elm setup downloads it from one place on either.
ARCH_MODE=native
UPSTREAM="https://github.com/elm/compiler"
# Layout: elm, a single executable like upstream's binary-for-linux-64-bit.gz. Upstream's is
# static (Alpine); this one links libgmp, libtinfo and zlib, all in Ubuntu's base image.
# The GHC to build with. ghcup's aarch64 bindists before 9.2 link libffi.so.7 and
# libnuma.so.1, which Ubuntu 26.04 lacks; from 9.2 on indexWord8Array# and friends take
# and return Word8#, which ghc-9.2.patch adapts 0.19.1's three modules using them to.
BUILD_GHC=9.2.8
# The Hackage index dependencies are resolved against, so a rebuild picks the same versions.
INDEX_STATE=2025-01-01T00:00:00Z
# elm.cabal's bounds that GHC 9.2.8 and that index rule out; only elm's own are lifted.
ALLOW_NEWER="bytestring containers network HTTP http-client http-client-tls ansi-terminal"
