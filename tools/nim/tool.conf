# Nim, the compiler plus nimble, atlas, nimsuggest, nimgrep and nimpretty. nim-lang.org
# releases ship linux x86_64 only (its arm64 nightlies are branch snapshots, not the release
# tags), so this builds the arm64 one CodingBooth's nim setup needs; x86_64 comes from upstream.
ARCH_MODE=native
ARCHES="arm64"
UPSTREAM="https://nim-lang.org"
# Layout matches upstream's nim-<version>-linux_x64.tar.xz: the release tree (bin/, lib/,
# config/, pkgs/, doc/, ...), built from nim-<version>.tar.xz the way nim-lang's own release
# script does. Nim finds lib/ next to bin/, so the folder can live anywhere.
# nimgrep and std/re need libpcre3 at run time, as upstream's do; Ubuntu 26.04 has none.
# Tracked versions (tracked.sh): the newest patch of each series from TRACK_FROM on, plus
# TRACK_ALSO: 1.6, the long-lived last 1.x line that older projects and nimble packages
# (`requires "nim >= 1.6"`) still pin. Older series are years out of use.
TRACK_FROM=2.0
TRACK_ALSO=1.6
