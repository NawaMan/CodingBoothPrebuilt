# evcxr_jupyter, the Rust Jupyter kernel behind CodingBooth's rust-nb-kernel.
# Upstream releases ship linux x86_64 only; this builds x86_64 and arm64 alike.
ARCH_MODE=native
UPSTREAM="https://github.com/evcxr/evcxr"
# Layout: bin/evcxr_jupyter. The binary is relocatable; at run time it drives the
# booth's own rustc/cargo, so it does not tie to a Rust version.
