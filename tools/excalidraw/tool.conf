# Excalidraw whiteboard app as static web files, for CodingBooth's `setup excalidraw`.
# The output is plain HTML/JS, so one build serves every CPU and distro.
ARCH_MODE=any
UPSTREAM="https://github.com/excalidraw/excalidraw"
NODE_MAJOR=22   # 0.18.x declares "node": "18.0.0 - 22.x.x"
# Layout: the contents of excalidraw-app/build/ from `yarn build:app:docker`
# (the self-hosted build, no collaboration backend), served as-is.
