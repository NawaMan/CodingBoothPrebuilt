# Scratch 3 editor (scratch-gui) as static web files, for CodingBooth's `setup scratch`.
# The output is plain HTML/JS, so one build serves every CPU and distro.
# Upstream is archived; v5.3.0 is its last release.
ARCH_MODE=any
UPSTREAM="https://github.com/scratchfoundation/scratch-gui"
NODE_MAJOR=20   # the repo's .nvmrc
# Layout: the contents of scratch-gui's build/ folder (index.html, …), served as-is.
# License: AGPL-3.0-only. LICENSE and SOURCE.txt (the exact source tag) ship inside.
