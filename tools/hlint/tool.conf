# HLint, the Haskell linter. Upstream releases ship linux x86_64 only; this builds
# both CPUs, so CodingBooth's haskell tools setup downloads from one place on either.
ARCH_MODE=native
UPSTREAM="https://github.com/ndmitchell/hlint"
# Layout matches upstream's release: hlint plus data/ beside it (hlint.yaml etc.), which
# hlint finds next to its executable, so the folder can live anywhere.
# Tracked versions (tracked.sh): those in Stackage LTS from this major on, and nightly, plus
# upstream's latest. Each builds with its snapshot's GHC (cb_build_ghc).
STACKAGE_FROM_LTS=21
