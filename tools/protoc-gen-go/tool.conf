# protoc-gen-go, the protoc plugin generating Go message code, behind CodingBooth's
# protobuf+go extension (`install go google.golang.org/protobuf/cmd/protoc-gen-go@latest`).
# Upstream's release binaries sit in its GitHub releases; this builds the same module the
# way the extension asks for it, once per Ubuntu + CPU, so every catalog binary comes from
# one sha256-checked place. Versions are google.golang.org/protobuf tags.
ARCH_MODE=native
UPSTREAM="https://github.com/protocolbuffers/protobuf-go"
# Layout: bin/protoc-gen-go, built with cgo off (a static binary), plus LICENSE.
