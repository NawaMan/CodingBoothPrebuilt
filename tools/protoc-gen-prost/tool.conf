# protoc-gen-prost, the protoc plugin generating Prost! message code, behind CodingBooth's
# protobuf+rust extension. Upstream publishes the crate only, so every booth compiled it
# with cargo; this builds it once per Ubuntu + CPU.
ARCH_MODE=native
UPSTREAM="https://github.com/neoeinstein/protoc-gen-prost"
# Layout: bin/protoc-gen-prost, plus the crate's licence files.
