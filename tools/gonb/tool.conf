# GoNB, the Go Jupyter kernel behind CodingBooth's go+kernel extension. Upstream publishes
# source only, so every booth compiled it with `go install`; this builds it once per
# Ubuntu + CPU.
ARCH_MODE=native
UPSTREAM="https://github.com/janpfeifer/gonb"
# Layout: bin/gonb, built with cgo off (a static binary), plus LICENSE. At run time it drives
# the booth's own go toolchain and needs goimports on PATH, which this does not ship.
