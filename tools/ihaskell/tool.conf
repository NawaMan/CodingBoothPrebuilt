# IHaskell, the Haskell Jupyter kernel behind CodingBooth's haskell-nb-kernel.
# VERSION is <ihaskell>-ghc<ghc>, e.g. 0.13.0.0-ghc9.12.4: the kernel embeds the GHC API,
# so it only runs on that exact GHC (installed by ghcup, as CodingBooth's haskell setup does).
ARCH_MODE=native
UPSTREAM="https://github.com/IHaskell/IHaskell"
# Not relocatable: data files (kernel.js, hlint.yaml, ...) are found through paths baked in
# at build time, so the asset must be extracted to exactly this prefix.
PREFIX_PATTERN="/opt/ihaskell/ihaskell-{version}"
# Layout under the prefix: bin/ihaskell, plus store/ghc-*/<package>/share for those data
# files. Register the kernel with: ihaskell install --ghclib "$(ghc --print-libdir)"
# Tracked versions (tracked.sh) pair the newest IHaskell with each tracked GHC from this one
# on. On 9.2 the exe fails to link: hlint's ghc-lib-parser 9.6 and GHC's own ghc library
# both define ghc_unique_inc.
TRACK_FROM_GHC=9.4
