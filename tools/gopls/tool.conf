# gopls, the Go language server, which CodingBooth's go template installs into every Go booth
# (`install go golang.org/x/tools/gopls@latest`). Upstream publishes source only, so every
# booth compiled it; this builds it once per Ubuntu + CPU. Versions are gopls module tags
# (golang.org/x/tools/gopls, e.g. 0.21.0), not golang.org/x/tools ones.
ARCH_MODE=native
UPSTREAM="https://pkg.go.dev/golang.org/x/tools/gopls"
# Layout: bin/gopls, built with cgo off (a static binary), plus LICENSE. At run time it needs
# the booth's own go toolchain on PATH.
