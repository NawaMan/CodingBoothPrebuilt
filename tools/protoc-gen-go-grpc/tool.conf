# protoc-gen-go-grpc, the protoc plugin generating Go gRPC service code, behind CodingBooth's
# protobuf+go extension (`install go google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest`).
# It is its own Go module inside grpc-go, tagged cmd/protoc-gen-go-grpc/vX.Y.Z; versions here
# are that tag's X.Y.Z. Built once per Ubuntu + CPU.
ARCH_MODE=native
UPSTREAM="https://github.com/grpc/grpc-go/tree/master/cmd/protoc-gen-go-grpc"
# Layout: bin/protoc-gen-go-grpc, built with cgo off (a static binary), plus LICENSE.
