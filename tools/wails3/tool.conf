# The Wails v3 CLI (wails3), behind CodingBooth's wails setup. Upstream publishes no Linux
# binaries, so every booth compiled it with `go install`; this builds it once per Ubuntu + CPU.
ARCH_MODE=native
UPSTREAM="https://github.com/wailsapp/wails"
# Layout: bin/wails3, built with cgo off (a static binary), plus LICENSE. Building an app with
# it still needs the booth's go toolchain and WebKitGTK headers, which the setup installs.
