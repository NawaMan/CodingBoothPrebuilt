# sqls, the SQL language server behind CodingBooth's lsp:sql. Upstream releases ship linux
# amd64 only; this builds both CPUs, so CodingBooth's sqls setup downloads from one place
# on either.
ARCH_MODE=native
UPSTREAM="https://github.com/sqls-server/sqls"
# Layout: sqls, a single executable like upstream's sqls-linux-<version>.zip.
