# goose-lang, the Goose programming language (aardappel/goose; the command CodingBooth
# installs is goose-lang, beside the Goose AI agent, which owns goose). Upstream releases
# ship linux x64 only, though TinyCC, its in-process backend, has an arm64 target and
# upstream builds macOS arm64; so this builds the arm64 one CodingBooth's goose-lang setup
# needs, and x86_64 comes from upstream.
ARCH_MODE=native
ARCHES="arm64"
UPSTREAM="https://github.com/aardappel/goose"
# Layout matches upstream's goose-v<version>-linux-x64.tar.gz: the compiler with every
# blessed package compiled in (GOOSE_BUILTIN_LIBS=all), stdlib/, tcclib/, the packages,
# docs/, samples/ and the VS Code extension, as scripts/package_release.py lays it out.
# The compiler finds them beside itself, so the folder can live anywhere.
# Tracked versions (tracked.sh): the newest this many releases. Goose versions are YYYY.N
# and come often, with no maintained older lines to follow.
TRACK_LATEST=3
