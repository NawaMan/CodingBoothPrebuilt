# Haskell Language Server, built from its release tag against one exact GHC, as ghcup
# installs it. VERSION is <hls>-ghc<ghc>, e.g. 2.14.0.0-ghc9.12.4: a server only runs on the
# GHC it was built with. ghcup's own arm64 builds of HLS are built against other builds of
# that GHC and fail with "GHC ABIs don't match"; these match CodingBooth's GHC (the ghc tool,
# which is ghcup's binary distribution) on both CPUs.
ARCH_MODE=native
UPSTREAM="https://github.com/haskell/haskell-language-server"
# Layout: what upstream's bindist installs, and ghcup keeps in .ghcup/hls/<hls>/:
# bin/haskell-language-server-<ghc> (upstream's wrapper script, which checks the GHC's ABIs
# and puts its libraries on LD_LIBRARY_PATH), bin/haskell-language-server-wrapper, and
# lib/haskell-language-server-<hls>/{bin,lib/<ghc>} with the server and its libraries.
# Relocatable: the script finds lib/ from where it is. Unpack every GHC's asset of one HLS
# into the same .ghcup/hls/<hls>/, then `ghcup set hls <hls>` links them into .ghcup/bin.
# Tracked versions (tracked.sh): ghcup's recommended and latest HLS, each paired with every
# tracked GHC (../ghc/tracked.sh) whose series its cabal file's tested-with names.
