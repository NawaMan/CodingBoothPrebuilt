# HeidiSQL, the SQL client, as its native Linux (Lazarus, Qt6) build. Upstream releases a
# .deb for amd64 that needs a libqt6pas6 Ubuntu does not package, and an unpackaged arm64
# tarball. This builds both CPUs with libQt6Pas inside, so CodingBooth's heidisql setup
# downloads from one place on either.
ARCH_MODE=native
UPSTREAM="https://github.com/HeidiSQL/HeidiSQL"
# Layout matches upstream's build-qt6-v<version>.tgz (heidisql, locale/, the functions-*.ini
# files, heidisql.png, README.md, LICENSE), plus lib/libQt6Pas.so.6, which the executable
# finds through its RUNPATH. HeidiSQL reads its files from beside itself, so the folder can
# live anywhere.
# The Lazarus release upstream builds with (.github/workflows/lazarus.yaml); HeidiSQL's
# patches for it are under extra/lazarus-patches/<this version>.
LAZARUS_VERSION=4.8
