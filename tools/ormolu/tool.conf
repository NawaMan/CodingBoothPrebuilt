# Ormolu, the Haskell formatter. Upstream releases ship linux x86_64 only, so this builds
# the arm64 one CodingBooth's haskell tools setup needs; x86_64 comes from upstream.
ARCH_MODE=native
ARCHES="arm64"
UPSTREAM="https://github.com/tweag/ormolu"
# Layout: ormolu, a single executable like upstream's release.
# Each release pins one ghc-lib-parser series, whose base bounds exclude newer GHCs; build
# those with the GHC of the Stackage LTS that ships them. Others use ghcup's recommended.
BUILD_GHC="0.5.3.0=9.4.8 0.7.2.0=9.6.7 0.7.4.0=9.8.4"
