# GNU Make, for CodingBooth's `setup make` (pinned versions; `apt` keeps the distro build).
ARCH_MODE=native
UPSTREAM="https://www.gnu.org/software/make/"
# Built with this prefix, which is where CodingBooth's make--setup.sh installs a
# version. Extract with: tar -xzf <asset>.tar.gz -C /opt/make/make-<ver> --strip-components=1
PREFIX_PATTERN="/opt/make/make-{version}"
