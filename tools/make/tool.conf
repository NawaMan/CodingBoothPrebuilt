# GNU Make at a pinned release, for CodingBooth's make setup when a version is named
# (MAKE_VERSION=4.4.1) instead of Ubuntu's package. Upstream ships source only, and building
# it puts build-essential into the image; this builds it once per Ubuntu + CPU.
ARCH_MODE=native
UPSTREAM="https://www.gnu.org/software/make/"
# Layout: the installed prefix (bin/make, include/, share/), built with
# --prefix=/opt/make/make-<version>, where CodingBooth's make setup unpacks it. It links
# only libc, so there is nothing else to install.
