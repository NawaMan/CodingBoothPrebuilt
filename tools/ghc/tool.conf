# GHC, the Haskell compiler, installed by ghcup -- CodingBooth's haskell setup and its
# haskell-nb-kernel unpack this instead of running `ghcup install ghc`, whose install step
# takes 6-7 minutes in a Docker build (unpacking this takes about 10 seconds).
ARCH_MODE=native
UPSTREAM="https://www.haskell.org/ghc/ (binary distributions installed by ghcup)"
# Layout: exactly ghcup's ~/.ghcup/ghc/<version>/ (bin/, lib/, share/), built at
# /opt/ghc/ghc-<version>. Relocatable with one fix-up: the wrapper scripts in bin/ name
# that prefix, so rewrite it after unpacking elsewhere:
#   grep -lr /opt/ghc/ghc-<version> bin | xargs sed -i 's|/opt/ghc/ghc-<version>|<new>|g'
# Unpacked into a ghcup's .ghcup/ghc/<version>, ghcup lists it as installed.
