# GNU Bash 5.x releases, for CodingBooth's bash setup when a release other than 3.2 is named
# (bash:5.2.37, bash:5.3) beside the image's own shell. Upstream ships source only, and
# building it puts build-essential into the image; this builds it once per Ubuntu + CPU.
# Bash 3.2 is not built here: NawaMan/Bash32Ubuntu has it, as a static binary.
ARCH_MODE=native
UPSTREAM="https://www.gnu.org/software/bash/"
# Layout: the installed prefix (bin/bash, bin/bashbug, lib/, include/, share/), built with
# --prefix=/opt/bash/bash-<version> --without-bash-malloc, where CodingBooth's bash setup
# unpacks it. It links only libc and libtinfo, which every Ubuntu image has (its own bash
# needs them), so there is nothing else to install.
# A version is the tarball's: X.Y.Z, or X.Y for a series' first release (5.3).
# Tracked versions (tracked.sh): the newest tarball of each series from TRACK_FROM on.
TRACK_FROM=5.2
