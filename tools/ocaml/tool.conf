# Compiler plus a pinned developer tool set. Bump toolsN when changing these pins.
ARCH_MODE=native
UPSTREAM="https://github.com/ocaml/ocaml"
TOOLS_REVISION=1
DUNE_VERSION=3.24.0
UTOP_VERSION=2.17.0
OCAMLFORMAT_VERSION=0.29.0
# VERSION is <compiler>-tools<revision>, e.g. 5.5.1-tools1.
# The opam root and compiler contain absolute paths; extract at this exact prefix.
PREFIX_PATTERN="/opt/ocaml/ocaml-{version}"
# apt packages the extracted bundle needs at run time; verify.sh installs exactly these.
RUNTIME_PACKAGES="build-essential m4 pkg-config git rsync unzip libgmp10 libev4 libzstd1 libglpk40"
# Tracked versions (tracked.sh): the newest patch of each series from TRACK_FROM on, plus
# the TRACK_ALSO series (4.14 is OCaml's long-term 4.x line).
TRACK_FROM=5.2
TRACK_ALSO="4.14"
