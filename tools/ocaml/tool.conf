# Compiler plus a pinned developer tool set. Bump toolsN when changing these pins.
ARCH_MODE=native
UPSTREAM="https://github.com/ocaml/ocaml"
TOOLS_REVISION=1
DUNE_VERSION=3.24.0
UTOP_VERSION=2.17.0
OCAMLFORMAT_VERSION=0.29.0
# VERSION is <compiler>-tools<revision>, e.g. 5.5.1-tools1.
# The opam root and compiler contain absolute paths; extract at this exact prefix.
PREFIX_PATTERN="/opt/ocaml/ocaml-{version}"
